services:
  - type: web
    name: informat
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      - key: SITE_URL
        sync: false
      - key: GOOGLE_SITE_VERIFICATION_FILE
        sync: false
      - key: GOOGLE_SITE_VERIFICATION_META
        sync: false
      - key: CONTACT_EMAIL
        sync: false
